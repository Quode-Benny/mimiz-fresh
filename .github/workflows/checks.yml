name: Platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm typecheck
      - run: pnpm test
      - run: node scripts/verify-test-safety.cjs
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start application
        run: |
          mkdir -p artifacts
          pnpm dev > artifacts/dev.log 2>&1 &
          node scripts/wait-ready.mjs
      - run: pnpm verify:installation
      - run: pnpm --filter @mimiz/api exec tsx scripts/verify-photo-cleanup.cts
      - run: pnpm backup
      - run: pnpm verify:restore
      - run: pnpm test:e2e
      - run: pnpm verify:accessibility
      - run: pnpm verify:api
      - run: pnpm verify:pwa
